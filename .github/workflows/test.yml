name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  checks: write

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 安装测试依赖（@deepseek-ai/dsh-llm，用来构造真实消息）
        run: npm ci --no-audit --no-fund
      - name: 语法检查
        run: npm run check
      - name: 单元测试（用固定帧，CI 里没有屏幕和 TCC 权限）
        run: npm run test:ci 2>&1 | tee /tmp/test.log
      - name: 失败时把日志写进检查输出
        if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/ci-report.mjs
